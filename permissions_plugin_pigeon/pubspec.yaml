name: permissions_plugin_pigeon
description: "A Flutter plugin demonstrating Pigeon FFI (Native Interop / JNI) for permissions on Android."
version: 0.1.0+1

environment:
  sdk: ^3.10.8
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  jni: ^1.0.3
  jni_flutter: ^1.0.3
  pigeon: ^29.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  jnigen: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.permissions_plugin_pigeon
        pluginClass: PermissionsPlugin
